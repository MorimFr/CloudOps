name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate trusted assessment manifests and entrypoints
        run: npm run assessments:validate

      - name: List discovered assessment metadata
        run: npm run assessments:list

      - name: Validate control packs, version pins, registries and permission plans
        run: npm run control-packs:validate

      - name: List static control pack metadata
        run: npm run control-packs:list

      - name: Unit tests
        run: npm run test

      - name: Validate CIS engineering blueprint (offline, no runtime pack)
        run: npm run cis:validate && npm run test:cis

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Responsive UI and execution regressions (synthetic data only)
        run: npm run test:ui

      - name: Production build
        run: npm run build

      - name: Build runtime image
        run: >-
          docker build
          --file docker/runtime.Dockerfile
          --target runtime
          --tag cloudops-runtime:ci
          .

      - name: Build engine test image
        run: >-
          docker build
          --file docker/runtime.Dockerfile
          --target development
          --tag cloudops-development:ci
          .

      - name: Validate Graph REST foundation
        run: >-
          docker run --rm
          --network none
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m
          --env HOME=/tmp/cloudops-home
          --env XDG_CACHE_HOME=/tmp/cloudops-home/.cache
          --env PSModuleAnalysisCachePath=/dev/null
          cloudops-development:ci
          pwsh -NoLogo -NoProfile -NonInteractive
          -File engine/tests/Validate-GraphModule.ps1

      - name: Validate Hello World engine E2E
        run: >-
          docker run --rm
          --network none
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m
          --env HOME=/tmp/cloudops-home
          --env XDG_CACHE_HOME=/tmp/cloudops-home/.cache
          --env PSModuleAnalysisCachePath=/dev/null
          cloudops-development:ci
          pwsh -NoLogo -NoProfile -NonInteractive
          -File engine/tests/Validate-HelloWorld.ps1

      - name: Validate inactive-user classification and streaming scale (synthetic)
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m
          --env HOME=/tmp/cloudops-home
          --env XDG_CACHE_HOME=/tmp/cloudops-home/.cache
          --env PSModuleAnalysisCachePath=/dev/null
          cloudops-development:ci pwsh -NoLogo -NoProfile -NonInteractive
          -File engine/tests/Validate-InactiveUsers.ps1 -ScaleUsers 10000

      - name: Authenticated HTTP and Wave 1 private AI exchange E2E (synthetic)
        run: >-
          docker run --rm --network none
          --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m
          --env PSModuleAnalysisCachePath=/dev/null
          cloudops-development:ci npm run test:e2e:local

      - name: Validate generic Assessment SDK, planner, risk and advisory boundary
        run: >-
          docker run --rm --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m
          --env HOME=/tmp/cloudops-home
          --env XDG_CACHE_HOME=/tmp/cloudops-home/.cache
          --env PSModuleAnalysisCachePath=/dev/null
          cloudops-development:ci pwsh -NoLogo -NoProfile -NonInteractive
          -File engine/tests/Validate-AssessmentSdk.ps1

      - name: Validate Identity DEV collectors, evaluators and offline ZIP pipeline
        run: >-
          docker run --rm --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m
          --env HOME=/tmp/cloudops-home
          --env XDG_CACHE_HOME=/tmp/cloudops-home/.cache
          --env PSModuleAnalysisCachePath=/dev/null
          cloudops-development:ci pwsh -NoLogo -NoProfile -NonInteractive
          -File engine/identity-assessment/tests/Validate-IdentityAssessment.ps1

      - name: Offline report responsive and print validation (synthetic)
        run: npm run test:reports
        env:
          CLOUDOPS_TEST_IMAGE: cloudops-runtime:ci

      - name: Validate Identity Wave 1, collectors and Report Standard (offline)
        run: |
          for validator in Validate-Wave1 Validate-Wave1Collectors Validate-Wave1Report; do
            docker run --rm --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
              --env HOME=/tmp/cloudops-home \
              --env XDG_CACHE_HOME=/tmp/cloudops-home/.cache \
              --env PSModuleAnalysisCachePath=/dev/null \
              cloudops-development:ci pwsh -NoLogo -NoProfile -NonInteractive \
              -File "engine/identity-assessment/tests/$validator.ps1"
          done
